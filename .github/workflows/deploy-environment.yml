name: Deploy App Platform environment (reusable)
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: app-platform-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment settings
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DO_APP_ID: ${{ vars.DO_APP_ID }}
          RELEASE_IMAGE: ${{ inputs.image }}
          REGISTRY: ${{ vars.DO_REGISTRY_NAME }}
          REPOSITORY: ${{ vars.DO_IMAGE_REPOSITORY || 'workflow-service' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENVIRONMENT" == staging || "$DEPLOY_ENVIRONMENT" == production ]]
          [[ -n "$DO_APP_ID" ]] || { echo 'Set DO_APP_ID in this GitHub environment'; exit 1; }
          [[ "$RELEASE_IMAGE" == "registry.digitalocean.com/$REGISTRY/$REPOSITORY@sha256:"* ]]
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy the digest and wait for App Platform readiness
        env:
          DO_APP_ID: ${{ vars.DO_APP_ID }}
          RELEASE_IMAGE: ${{ inputs.image }}
          REGISTRY: ${{ vars.DO_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          [[ "$(doctl registry get --format Name --no-header)" == "$REGISTRY" ]]
          python3 deploy/app-platform.py "$DO_APP_ID" "$RELEASE_IMAGE"
      - name: Record successful deployment
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DO_APP_ID: ${{ vars.DO_APP_ID }}
          RELEASE_IMAGE: ${{ inputs.image }}
        run: |
          printf '%s release: %s\n\n[App Platform](https://cloud.digitalocean.com/apps/%s)\n' \
            "$DEPLOY_ENVIRONMENT" "$RELEASE_IMAGE" "$DO_APP_ID" >> "$GITHUB_STEP_SUMMARY"
