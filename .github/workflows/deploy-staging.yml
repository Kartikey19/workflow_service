name: Deploy staging
on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact DOCR image@sha256:digest from Build and deploy App Platform
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      image: ${{ inputs.image }}
    secrets: inherit
