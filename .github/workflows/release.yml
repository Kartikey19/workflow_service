name: Build and optional production release
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this image to the configured production host
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: ${{ inputs.deploy }}
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Upload configuration and release the immutable image
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -o StrictHostKeyChecking=yes "$target" 'mkdir -p /opt/workflow/deploy'
          rsync -a --exclude='.env' --exclude='__pycache__' -e 'ssh -o StrictHostKeyChecking=yes' deploy/ "$target:/opt/workflow/deploy/"
          ssh -o StrictHostKeyChecking=yes "$target" "cd /opt/workflow/deploy && ./deploy.sh '$RELEASE_IMAGE'"
