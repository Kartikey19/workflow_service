name: CI
on:
  workflow_call:
  push:
    branches-ignore: [main] # Build and deploy App Platform calls this CI for main.
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # MySQL and MongoDB fixtures are only needed by the optional full
      # integration suite, which is disabled in CI below.
    env:
      DATABASE_URL: postgres://workflow:workflow_test@localhost:5432/workflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check App Platform release safeguards
        run: python3 deploy/test-app-platform.py
      - run: make ui-install ui-check
      - run: npx --prefix web playwright install --with-deps chromium
      - name: Check Go modules, formatting, generated code, vet and unit tests
        run: make check-mod check-fmt check-generated vet test
      # Full database integration tests remain available locally:
      # - run: make test-integration
      - run: make ui-browser
      - name: Smoke-test combined API/worker startup, migrations and restart
        run: go test -count=1 -tags=integration ./test/integration -run '^TestCombinedAPIWorkerMigratesAndRestarts$' -timeout=60s
      - name: Verify migration command and repeat run
        run: |
          make migrate
          make migrate
      - name: Lint workflows (POST /be/v1/workflows?dry_run=true)
        run: make lint-workflows
      - run: go test -race ./...
      # - run: go test -race -count=1 -tags=integration ./test/integration
  packaging:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the embedded UI and distroless binaries
        run: docker build -f deploy/Dockerfile -t workflow-service:acceptance .
      - name: Local HTTPS, rolling replacement and backup restore acceptance
        run: python3 deploy/test-local.py
      - name: Environment deployment safeguards
        run: |
          bash -n deploy/env-deploy.sh
          python3 deploy/test-runtime.py
          EDGE_ENV_FILE=env.example docker compose --env-file deploy/edge/env.example -f deploy/edge/compose.yaml config --quiet
          docker run --rm -e ACME_EMAIL=operator@example.com \
            -e PRODUCTION_DOMAIN=app.example.com -e STAGING_DOMAIN=staging.example.com \
            -v "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate Alloy configuration
        run: |
          GRAFANA_METRICS_URL=http://localhost:9090/api/v1/write \
          GRAFANA_LOKI_URL=http://localhost:3100/loki/api/v1/push \
          docker run --rm -e GRAFANA_METRICS_URL -e GRAFANA_LOKI_URL \
            -v "$PWD/deploy/observability/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.15.0 validate /etc/alloy/config.alloy
