name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: workflow_test
          MYSQL_DATABASE: workflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pworkflow_test --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://workflow:workflow_test@localhost:5432/workflow_test?sslmode=disable
      MYSQL_URL: root:workflow_test@tcp(127.0.0.1:3306)/workflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - name: Verify migration command and repeat run
        run: |
          make migrate
          make migrate
      - name: Lint workflows (POST /v1/workflows?dry_run=true)
        run: make lint-workflows
      - run: go test -race ./...
      - run: go test -race -count=1 -tags=integration ./test/integration
