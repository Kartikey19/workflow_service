name: workflow-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run make local-init first}
      POSTGRES_DB: workflow_local
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workflow -d workflow_local']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres: {}
